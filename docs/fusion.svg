<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 520" width="940" height="520" role="img" aria-label="LiDAR, IMU and CAN streams draining into a 100 Hz fusion tick and out to Parquet">
<title>VehTelemetry: three sensor streams drained by one 100 Hz fusion tick</title>
<text x="24" y="34" font-family="Helvetica,Arial,sans-serif" font-size="19" font-weight="bold" fill="#4c9be8">VehTelemetry &#8212; three rates in, one 100 Hz fused stream out</text>
<text x="24" y="56" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#8b949e">each animation cycle is one 10 ms fusion tick: drain the queues, fuse, publish, then sleep to the next absolute deadline</text>
<text x="24" y="106" font-family="Helvetica,Arial,sans-serif" font-size="14" font-weight="bold" fill="#4c9be8">LiDAR VLP-16 sim</text>
<text x="24" y="124" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#8b949e">10 Hz spin, 30k points/rev</text>
<line x1="200" y1="114" x2="380" y2="114" stroke="#8b949e" stroke-width="1.5" stroke-opacity="0.4"/>
<rect x="380" y="92" width="120" height="44" rx="7" fill="none" stroke="#4c9be8" stroke-width="2" stroke-opacity="0.8"/>
<text x="440" y="110" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#8b949e" text-anchor="middle">SpscQueue&lt;LidarPoint, 65536&gt;</text>
<text x="440" y="124" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#8b949e" text-anchor="middle">lock-free, cache-padded</text>
<circle r="5" fill="#4c9be8" fill-opacity="0.9">
<animate attributeName="cx" values="200;380" dur="1s" begin="0s" repeatCount="indefinite"/>
<animate attributeName="cy" values="114;114" dur="1s" begin="0s" repeatCount="indefinite"/>
</circle>
<circle r="5" fill="#4c9be8" fill-opacity="0.9">
<animate attributeName="cx" values="200;380" dur="1s" begin="0.167s" repeatCount="indefinite"/>
<animate attributeName="cy" values="114;114" dur="1s" begin="0.167s" repeatCount="indefinite"/>
</circle>
<circle r="5" fill="#4c9be8" fill-opacity="0.9">
<animate attributeName="cx" values="200;380" dur="1s" begin="0.333s" repeatCount="indefinite"/>
<animate attributeName="cy" values="114;114" dur="1s" begin="0.333s" repeatCount="indefinite"/>
</circle>
<circle r="5" fill="#4c9be8" fill-opacity="0.9">
<animate attributeName="cx" values="200;380" dur="1s" begin="0.5s" repeatCount="indefinite"/>
<animate attributeName="cy" values="114;114" dur="1s" begin="0.5s" repeatCount="indefinite"/>
</circle>
<circle r="5" fill="#4c9be8" fill-opacity="0.9">
<animate attributeName="cx" values="200;380" dur="1s" begin="0.667s" repeatCount="indefinite"/>
<animate attributeName="cy" values="114;114" dur="1s" begin="0.667s" repeatCount="indefinite"/>
</circle>
<circle r="5" fill="#4c9be8" fill-opacity="0.9">
<animate attributeName="cx" values="200;380" dur="1s" begin="0.833s" repeatCount="indefinite"/>
<animate attributeName="cy" values="114;114" dur="1s" begin="0.833s" repeatCount="indefinite"/>
</circle>
<line x1="500" y1="114" x2="520" y2="260" stroke="#4c9be8" stroke-width="2" stroke-opacity="0.25">
<animate attributeName="stroke-opacity" values="0.25;1;0.25" keyTimes="0;0.06;0.35" dur="1s" repeatCount="indefinite"/>
</line>
<text x="24" y="196" font-family="Helvetica,Arial,sans-serif" font-size="14" font-weight="bold" fill="#56b877">IMU MPU-9250 sim</text>
<text x="24" y="214" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#8b949e">1 kHz, SCHED_FIFO prio 60</text>
<line x1="200" y1="204" x2="380" y2="204" stroke="#8b949e" stroke-width="1.5" stroke-opacity="0.4"/>
<rect x="380" y="182" width="120" height="44" rx="7" fill="none" stroke="#56b877" stroke-width="2" stroke-opacity="0.8"/>
<text x="440" y="200" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#8b949e" text-anchor="middle">SpscQueue&lt;ImuSample, 8192&gt;</text>
<text x="440" y="214" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#8b949e" text-anchor="middle">lock-free, cache-padded</text>
<circle r="5" fill="#56b877" fill-opacity="0.9">
<animate attributeName="cx" values="200;380" dur="1s" begin="0s" repeatCount="indefinite"/>
<animate attributeName="cy" values="204;204" dur="1s" begin="0s" repeatCount="indefinite"/>
</circle>
<circle r="5" fill="#56b877" fill-opacity="0.9">
<animate attributeName="cx" values="200;380" dur="1s" begin="0.25s" repeatCount="indefinite"/>
<animate attributeName="cy" values="204;204" dur="1s" begin="0.25s" repeatCount="indefinite"/>
</circle>
<circle r="5" fill="#56b877" fill-opacity="0.9">
<animate attributeName="cx" values="200;380" dur="1s" begin="0.5s" repeatCount="indefinite"/>
<animate attributeName="cy" values="204;204" dur="1s" begin="0.5s" repeatCount="indefinite"/>
</circle>
<circle r="5" fill="#56b877" fill-opacity="0.9">
<animate attributeName="cx" values="200;380" dur="1s" begin="0.75s" repeatCount="indefinite"/>
<animate attributeName="cy" values="204;204" dur="1s" begin="0.75s" repeatCount="indefinite"/>
</circle>
<line x1="500" y1="204" x2="520" y2="260" stroke="#56b877" stroke-width="2" stroke-opacity="0.25">
<animate attributeName="stroke-opacity" values="0.25;1;0.25" keyTimes="0;0.06;0.35" dur="1s" repeatCount="indefinite"/>
</line>
<text x="24" y="286" font-family="Helvetica,Arial,sans-serif" font-size="14" font-weight="bold" fill="#e8a33d">CAN / OBD-II</text>
<text x="24" y="304" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#8b949e">SocketCAN vcan0 or 50 Hz sim</text>
<line x1="200" y1="294" x2="380" y2="294" stroke="#8b949e" stroke-width="1.5" stroke-opacity="0.4"/>
<rect x="380" y="272" width="120" height="44" rx="7" fill="none" stroke="#e8a33d" stroke-width="2" stroke-opacity="0.8"/>
<text x="440" y="290" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#8b949e" text-anchor="middle">SpscQueue&lt;ObdData, 4096&gt;</text>
<text x="440" y="304" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#8b949e" text-anchor="middle">lock-free, cache-padded</text>
<circle r="5" fill="#e8a33d" fill-opacity="0.9">
<animate attributeName="cx" values="200;380" dur="1s" begin="0s" repeatCount="indefinite"/>
<animate attributeName="cy" values="294;294" dur="1s" begin="0s" repeatCount="indefinite"/>
</circle>
<circle r="5" fill="#e8a33d" fill-opacity="0.9">
<animate attributeName="cx" values="200;380" dur="1s" begin="0.5s" repeatCount="indefinite"/>
<animate attributeName="cy" values="294;294" dur="1s" begin="0.5s" repeatCount="indefinite"/>
</circle>
<line x1="500" y1="294" x2="520" y2="260" stroke="#e8a33d" stroke-width="2" stroke-opacity="0.25">
<animate attributeName="stroke-opacity" values="0.25;1;0.25" keyTimes="0;0.06;0.35" dur="1s" repeatCount="indefinite"/>
</line>
<rect x="520" y="180" width="190" height="164" rx="10" fill="none" stroke="#b07cd8" stroke-width="2.5">
<animate attributeName="stroke-opacity" values="0.5;1;0.5" keyTimes="0;0.08;0.4" dur="1s" repeatCount="indefinite"/>
</rect>
<text x="615" y="206" font-family="Helvetica,Arial,sans-serif" font-size="14" font-weight="bold" fill="#b07cd8" text-anchor="middle">FusionEngine 100 Hz</text>
<text x="615" y="226" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#8b949e" text-anchor="middle">drain every IMU sample,</text>
<text x="615" y="242" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#8b949e" text-anchor="middle">integrate gyro into the quaternion</text>
<text x="615" y="258" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#8b949e" text-anchor="middle">blend accel pitch/roll, alpha 0.98</text>
<text x="615" y="274" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#8b949e" text-anchor="middle">drain OBD, keep last speed / rpm</text>
<text x="615" y="290" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#8b949e" text-anchor="middle">pop up to 500 LiDAR points,</text>
<text x="615" y="306" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#8b949e" text-anchor="middle">forward-sector density</text>
<text x="615" y="322" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#8b949e" text-anchor="middle">dead reckon position from yaw</text>
<circle r="7" fill="#b07cd8">
<animate attributeName="cx" values="710;770;770" keyTimes="0;0.45;1" dur="1s" repeatCount="indefinite"/>
<animate attributeName="cy" values="262;262;262" dur="1s" repeatCount="indefinite"/>
<animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.45;0.5" dur="1s" repeatCount="indefinite"/>
</circle>
<text x="740" y="248" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#8b949e" text-anchor="middle">FusedSample</text>
<rect x="770" y="180" width="140" height="164" rx="10" fill="none" stroke="#56b877" stroke-width="2"/>
<text x="840" y="206" font-family="Helvetica,Arial,sans-serif" font-size="14" font-weight="bold" fill="#56b877" text-anchor="middle">ParquetExporter</text>
<text x="840" y="228" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#8b949e" text-anchor="middle">Arrow C++ tables</text>
<text x="840" y="245" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#8b949e" text-anchor="middle">1000 rows per row group</text>
<text x="840" y="262" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#8b949e" text-anchor="middle">snappy compression</text>
<text x="840" y="279" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#8b949e" text-anchor="middle">new file every 60 s</text>
<rect x="786" y="304" width="108" height="14" rx="4" fill="none" stroke="#8b949e" stroke-width="1.5" stroke-opacity="0.6"/>
<rect x="786" y="304" height="14" rx="4" fill="#56b877" fill-opacity="0.55" width="0">
<animate attributeName="width" values="0;108;0" keyTimes="0;0.97;1" dur="10s" repeatCount="indefinite"/>
</rect>
<text x="840" y="332" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#8b949e" text-anchor="middle">batch fills, then flush_batch writes a row group</text>
<text x="24" y="396" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#8b949e">clock_nanosleep(CLOCK_MONOTONIC, TIMER_ABSTIME) &#8212; the next deadline is absolute, so a slow tick does not push the schedule out</text>
<line x1="24" y1="424" x2="900" y2="424" stroke="#8b949e" stroke-width="2" stroke-opacity="0.5"/>
<line x1="24" y1="412" x2="24" y2="436" stroke="#b07cd8" stroke-width="2"/>
<text x="24" y="454" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#8b949e" text-anchor="middle">0 ms</text>
<line x1="121" y1="412" x2="121" y2="436" stroke="#b07cd8" stroke-width="2"/>
<text x="121" y="454" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#8b949e" text-anchor="middle">10 ms</text>
<line x1="218" y1="412" x2="218" y2="436" stroke="#b07cd8" stroke-width="2"/>
<text x="218" y="454" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#8b949e" text-anchor="middle">20 ms</text>
<line x1="315" y1="412" x2="315" y2="436" stroke="#b07cd8" stroke-width="2"/>
<text x="315" y="454" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#8b949e" text-anchor="middle">30 ms</text>
<line x1="412" y1="412" x2="412" y2="436" stroke="#b07cd8" stroke-width="2"/>
<text x="412" y="454" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#8b949e" text-anchor="middle">40 ms</text>
<line x1="509" y1="412" x2="509" y2="436" stroke="#b07cd8" stroke-width="2"/>
<text x="509" y="454" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#8b949e" text-anchor="middle">50 ms</text>
<line x1="606" y1="412" x2="606" y2="436" stroke="#b07cd8" stroke-width="2"/>
<text x="606" y="454" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#8b949e" text-anchor="middle">60 ms</text>
<line x1="703" y1="412" x2="703" y2="436" stroke="#b07cd8" stroke-width="2"/>
<text x="703" y="454" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#8b949e" text-anchor="middle">70 ms</text>
<line x1="800" y1="412" x2="800" y2="436" stroke="#b07cd8" stroke-width="2"/>
<text x="800" y="454" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#8b949e" text-anchor="middle">80 ms</text>
<line x1="897" y1="412" x2="897" y2="436" stroke="#b07cd8" stroke-width="2"/>
<text x="897" y="454" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#8b949e" text-anchor="middle">90 ms</text>
<circle r="7" cy="424" fill="#b07cd8">
<animate attributeName="cx" values="24;897" dur="9s" repeatCount="indefinite"/>
</circle>
<text x="24" y="486" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#8b949e">every tick records its own latency; if the fused queue is full the sample is dropped and counted rather than blocking the pipeline</text>
</svg>